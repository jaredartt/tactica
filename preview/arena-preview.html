<title>Tactica Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* Tactica — arena preview.
   Deliberately single-theme: this is a lit arena in a dark room, and it should
   look the same on any viewer's setup. Every colour is painted explicitly. */
:root {
  color-scheme: dark;
  --bg: #0a0b0f;
  --panel: #101219;
  --panel-2: #14171f;
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.14);
  --text: #e7e9ef;
  --muted: #878da0;
  --host: #38bdf8;
  --guest: #fb923c;
  --danger: #f87171;
  --good: #4ade80;
  --ui: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1100px 600px at 50% -10%, #171b26 0%, transparent 70%), var(--bg);
  color: var(--text);
  font: 400 14px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.muted { color: var(--muted); }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- preview banner ---- */
.note {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 18px; background: rgba(56,189,248,.06);
  border-bottom: 1px solid rgba(56,189,248,.18);
  font-size: 12.5px; color: var(--muted);
}
.note b { color: var(--host); font-family: var(--ui); font-weight: 600; letter-spacing: .04em; }

/* ---- top bar ---- */
.matchbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--ui); font-weight: 700; letter-spacing: .22em; font-size: 15px; }
.scoreline { display: flex; align-items: center; gap: 14px; }
.vs { color: var(--muted); font-size: 12px; }
.nameplate {
  font-family: var(--ui); font-weight: 500; font-size: 13px;
  padding: 4px 13px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); transition: color .25s, border-color .25s, box-shadow .25s;
}
.nameplate em { font-style: normal; font-size: 10px; opacity: .6; margin-left: 6px; letter-spacing: .1em; }
.nameplate.host.active { color: var(--host); border-color: var(--host); box-shadow: 0 0 22px rgba(56,189,248,.18); }
.nameplate.guest.active { color: var(--guest); border-color: var(--guest); box-shadow: 0 0 22px rgba(251,146,60,.18); }
.roomcode {
  font-family: var(--mono); letter-spacing: .18em; font-size: 13px;
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 5px 12px; border-radius: 8px;
}

/* ---- turn clock ---- */
.timerbar { position: relative; height: 24px; background: var(--panel); border-bottom: 1px solid var(--line); overflow: hidden; }
.timerfill { height: 100%; width: 100%; background: linear-gradient(90deg, rgba(56,189,248,.35), rgba(56,189,248,.12)); transition: width .2s linear; }
.timerbar.urgent .timerfill { background: linear-gradient(90deg, rgba(248,113,113,.45), rgba(248,113,113,.14)); }
.timertext {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--ui); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.timerbar.urgent .timertext { color: var(--danger); }

/* ---- three-column stage ---- */
.stage { flex: 1; display: grid; grid-template-columns: 250px 1fr 270px; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.side-left { border-right: 1px solid var(--line); }
.side-right { border-left: 1px solid var(--line); }
.side-title {
  margin: 0; padding: 12px 16px; font-family: var(--ui); font-weight: 600;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--line);
}
.side-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.side-foot { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
.side-foot input {
  flex: 1; min-width: 0; padding: 7px 10px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; outline: none;
}
.side-foot input:focus { border-color: var(--line-strong); }
.msg { font-size: 13px; }
.msg-who { color: var(--muted); margin-right: 7px; }
.msg-own .msg-who { color: var(--host); }
.msg-spec .msg-who { color: var(--muted); opacity: .8; }
.msg-spec .msg-who::after { content: " ·watching"; font-size: 10px; letter-spacing: .06em; }
.logline { display: flex; gap: 9px; font-size: 12.5px; color: #c3c8d4; }
.log-turn { color: var(--muted); font-family: var(--mono); font-size: 11px; flex: none; padding-top: 1px; }

.center {
  position: relative; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 20px;
}

/* ---- the arena ---- */
.arena { perspective: 1500px; perspective-origin: 50% 34%; display: grid; place-items: start center; }
.arena-scene { position: relative; display: grid; place-items: start center; }
.board { position: relative; transform-style: preserve-3d; transform-origin: 50% 0%; }
.board-glow {
  position: absolute; inset: -80px -60px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(120,145,200,.10), transparent 75%);
}
.tile {
  position: absolute; border-radius: 4px; background: #12141b;
  border: 1px solid rgba(255,255,255,.05);
  transition: background .18s, border-color .18s, box-shadow .18s;
}
.tile.b { background: #151822; }
.tile.move {
  background: rgba(56,189,248,.13); border-color: rgba(56,189,248,.45); cursor: pointer;
  box-shadow: inset 0 0 22px rgba(56,189,248,.13);
}
.tile.move:hover { background: rgba(56,189,248,.26); }
.tile .dot {
  position: absolute; inset: 50% auto auto 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
  border-radius: 50%; background: var(--host); opacity: .75;
}

.unit-anchor { position: absolute; transform-style: preserve-3d; pointer-events: none; }
.unit-shadow {
  position: absolute; left: 50%; bottom: 8px; width: 56px; height: 19px; margin-left: -28px;
  background: radial-gradient(closest-side, rgba(0,0,0,.62), transparent); filter: blur(2px);
  transition: transform .22s cubic-bezier(.2,.8,.3,1), opacity .22s;
}
.unit {
  position: absolute; left: 50%; bottom: 6px; margin-left: -34px;
  width: 68px; height: 84px; pointer-events: auto; cursor: pointer;
  transform-origin: 50% 100%;
  transform: rotateX(var(--tilt)) translateY(0) scale(1);
  transition: transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, filter .22s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 5px 6px; border-radius: 8px;
  background: linear-gradient(#1b1f2b, #12151d);
  border: 1px solid var(--line-strong);
  box-shadow: 0 6px 18px rgba(0,0,0,.5);
  animation: breathe 3.8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: rotateX(var(--tilt)) translateY(0) scale(1); }
  50%      { transform: rotateX(var(--tilt)) translateY(-4px) scale(1.005); }
}
.unit.mine { border-color: rgba(56,189,248,.55); box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 26px rgba(56,189,248,.14); }
.unit.foe  { border-color: rgba(251,146,60,.5);  box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 26px rgba(251,146,60,.12); }
.unit-anchor:hover .unit {
  animation: none;
  transform: rotateX(var(--tilt)) translateY(-16px) scale(1.07);
  box-shadow: 0 22px 34px rgba(0,0,0,.6), 0 0 34px rgba(255,255,255,.07);
  z-index: 5;
}
.unit-anchor:hover .unit-shadow { transform: scale(.78); opacity: .5; }
.unit.selected {
  animation: none; border-color: #fff;
  transform: rotateX(var(--tilt)) translateY(-12px) scale(1.05);
  box-shadow: 0 18px 30px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.6);
}
.unit.target { animation: none; cursor: crosshair; border-color: var(--danger); }
.unit.target:hover { box-shadow: 0 22px 34px rgba(0,0,0,.6), 0 0 0 2px var(--danger), 0 0 30px rgba(248,113,113,.4); }
.unit.spent { filter: saturate(.35) brightness(.72); animation: none; }
.unit-art {
  width: 100%; flex: 1; min-height: 0; border-radius: 5px; overflow: hidden;
  display: grid; place-items: center;
  background: radial-gradient(circle at 50% 35%, var(--wash), transparent 70%), #0d1017;
}
.unit-initial { font-family: var(--ui); font-size: 22px; font-weight: 700; color: var(--accent); }
.unit-name {
  font-family: var(--ui); font-weight: 600; font-size: 8.5px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--accent);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.unit-hpbar { width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.unit-hpbar span { display: block; height: 100%; background: var(--good); transition: width .35s ease; }
.unit-hp {
  position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px; padding: 0 4px;
  border-radius: 999px; background: #0b0d13; border: 1px solid var(--line-strong);
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.unit-crosshair {
  position: absolute; inset: -6px; border: 1px dashed var(--danger); border-radius: 11px;
  animation: pulse 1.1s ease-in-out infinite; pointer-events: none;
}
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }

/* ---- action bar ---- */
.actionbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  padding: 9px 16px; background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: 8px; transition: background .15s, transform .08s;
  font-family: var(--ui); font-weight: 500; letter-spacing: .03em;
}
.btn:hover:not(:disabled) { background: #1b1f29; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--host); border-color: var(--host); color: #06212e; font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--host); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; }
:focus-visible { outline: 2px solid var(--host); outline-offset: 2px; }

.verdict { font-family: var(--ui); font-size: 18px; letter-spacing: .04em; }

@media (max-width: 1080px) {
  .stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
  .center { order: -1; }
  .side { max-height: 200px; }
  .side-left, .side-right { border: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) {
  .unit, .unit-crosshair { animation: none !important; }
  .unit, .unit-shadow, .tile, .timerfill { transition: none !important; }
}
</style>

<div class="app">
  <div class="note">
    <b>PREVIEW</b>
    <span>Both sides on one screen, no network. In the real build this exact
    screen is two browsers talking through Supabase.</span>
    <span style="color:#e7e9ef">Hover a card. Click one of the lit units, then a glowing tile to move or a marked enemy to strike.</span>
  </div>

  <header class="matchbar">
    <span class="brand">TACTICA</span>
    <div class="scoreline">
      <span class="nameplate host active" id="npHost">jared<em>YOU</em></span>
      <span class="vs">vs</span>
      <span class="nameplate guest" id="npGuest">opponent</span>
    </div>
    <span class="roomcode">K7QN3</span>
  </header>

  <div class="timerbar" id="timerbar">
    <div class="timerfill" id="timerfill"></div>
    <span class="timertext" id="timertext"></span>
  </div>

  <div class="stage">
    <aside class="side side-left">
      <h2 class="side-title">Chat</h2>
      <div class="side-body" id="chat"></div>
      <form class="side-foot" id="chatform">
        <input id="chatinput" placeholder="Say something…" maxlength="200" aria-label="Chat message">
        <button class="btn" type="submit" style="padding:7px 12px">Send</button>
      </form>
    </aside>

    <main class="center">
      <div class="arena">
        <div class="arena-scene" id="scene">
          <div class="board" id="board"><div class="board-glow"></div></div>
        </div>
      </div>
      <div class="actionbar" id="actionbar"></div>
    </main>

    <aside class="side side-right">
      <h2 class="side-title">Battle log</h2>
      <div class="side-body" id="log"></div>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  const W = 7, H = 5, TILE = 76, GAP = 6, TILT = 52, TURN_SECONDS = 30;

  // Same four placeholder cards the migration seeds into the roster.
  const ROSTER = {
    vanguard: { name: 'Vanguard', hp: 14, atk: 4, mov: 3, rng: 1, accent: '#f0abfc' },
    archer:   { name: 'Archer',    hp: 8, atk: 4, mov: 2, rng: 3, accent: '#fde68a' },
  };

  const mk = (id, owner, card, x, y) => ({
    id, owner, x, y, moved: false, acted: false,
    ...ROSTER[card], maxHp: ROSTER[card].hp,
  });

  const game = {
    turn: 'host', turnNumber: 1, selected: null, winner: null,
    deadline: Date.now() + TURN_SECONDS * 1000,
    units: [
      mk('h1', 'host',  'vanguard', 0, 1),
      mk('h2', 'host',  'archer',   0, 3),
      mk('g1', 'guest', 'vanguard', 6, 1),
      mk('g2', 'guest', 'archer',   6, 3),
    ],
    log: [{ t: 1, text: 'opponent entered the arena.' },
          { t: 1, text: 'Turn 1 — jared to act.' }],
    chat: [
      { who: 'opponent', text: 'ok show me what you built' },
      { who: 'jared', text: 'archer first, watch the range', own: true },
      { who: 'mara', text: 'go left, the vanguard is exposed', spec: true },
    ],
  };

  const $ = (id) => document.getElementById(id);
  const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const at = (x, y) => game.units.find((u) => u.x === x && u.y === y);
  const sel = () => game.units.find((u) => u.id === game.selected) || null;
  const mySide = 'host';   // the preview always shows the host's point of view

  function say(text) { game.log.push({ t: game.turnNumber, text }); }

  function reachable() {
    const u = sel(); const out = new Set();
    if (!u || u.owner !== game.turn || u.owner !== mySide || u.moved || game.winner) return out;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = dist(u, { x, y });
      if (d > 0 && d <= u.mov && !at(x, y)) out.add(x + ',' + y);
    }
    return out;
  }

  function targets() {
    const u = sel(); const out = new Set();
    if (!u || u.owner !== game.turn || u.owner !== mySide || u.acted || game.winner) return out;
    for (const o of game.units) if (o.owner !== u.owner && dist(u, o) <= u.rng) out.add(o.id);
    return out;
  }

  // ---- actions ------------------------------------------------------------
  function move(x, y) {
    const u = sel(); if (!u) return;
    u.x = x; u.y = y; u.moved = true;
    say(u.name + ' advances.');
    render();
  }

  function attack(targetId) {
    const u = sel(); const t = game.units.find((z) => z.id === targetId);
    if (!u || !t) return;
    t.hp -= u.atk; u.acted = true; u.moved = true;
    const dead = t.hp <= 0;
    if (dead) game.units = game.units.filter((z) => z.id !== t.id);
    say(u.name + ' hits ' + t.name + ' for ' + u.atk + (dead ? ' — destroyed.' : '.'));
    if (!game.units.some((z) => z.owner !== u.owner)) {
      game.winner = u.owner;
      say((u.owner === 'host' ? 'jared' : 'opponent') + ' wins.');
      game.deadline = Infinity;
    }
    game.selected = null;
    render();
  }

  function endTurn(note) {
    if (game.winner) return;
    game.turn = game.turn === 'host' ? 'guest' : 'host';
    game.turnNumber += 1;
    game.units.forEach((u) => { u.moved = false; u.acted = false; });
    game.selected = null;
    if (note) say(note);
    say('Turn ' + game.turnNumber + ' — ' + (game.turn === 'host' ? 'jared' : 'opponent') + ' to act.');
    game.deadline = Date.now() + TURN_SECONDS * 1000;
    render();
  }

  // The opponent, played by nobody in particular.
  function opponentPlays() {
    if (game.turn !== 'guest' || game.winner) return;
    const mine = game.units.filter((u) => u.owner === 'guest');
    const foes = game.units.filter((u) => u.owner === 'host');
    for (const u of mine) {
      if (!foes.length) break;
      let best = foes[0];
      for (const f of foes) if (dist(u, f) < dist(u, best)) best = f;
      if (dist(u, best) > u.rng) {                       // step toward the target
        const step = { x: u.x, y: u.y };
        let left = u.mov;
        while (left-- > 0) {
          const nx = { x: step.x + Math.sign(best.x - step.x), y: step.y };
          const ny = { x: step.x, y: step.y + Math.sign(best.y - step.y) };
          const pick = (Math.abs(best.x - step.x) >= Math.abs(best.y - step.y)) ? nx : ny;
          if (pick.x === step.x && pick.y === step.y) break;
          if (at(pick.x, pick.y)) break;
          step.x = pick.x; step.y = pick.y;
        }
        if (step.x !== u.x || step.y !== u.y) { u.x = step.x; u.y = step.y; say(u.name + ' advances.'); }
      }
      if (dist(u, best) <= u.rng && game.units.includes(best)) {
        best.hp -= u.atk;
        const dead = best.hp <= 0;
        if (dead) game.units = game.units.filter((z) => z.id !== best.id);
        say(u.name + ' hits ' + best.name + ' for ' + u.atk + (dead ? ' — destroyed.' : '.'));
        if (!game.units.some((z) => z.owner === 'host')) {
          game.winner = 'guest'; say('opponent wins.'); game.deadline = Infinity; render(); return;
        }
      }
    }
    setTimeout(() => endTurn(null), 700);
    render();
  }

  // ---- rendering ----------------------------------------------------------
  const board = $('board');
  const boardW = W * TILE + (W - 1) * GAP;
  const boardH = H * TILE + (H - 1) * GAP;
  board.style.width = boardW + 'px';
  board.style.height = boardH + 'px';
  board.style.transform = 'rotateX(' + TILT + 'deg)';
  $('scene').style.width = boardW + 'px';
  $('scene').style.height = (boardH * Math.cos(TILT * Math.PI / 180) + 170) + 'px';

  function render() {
    const canMove = reachable(), canHit = targets();

    board.querySelectorAll('.tile, .unit-anchor').forEach((n) => n.remove());

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const key = x + ',' + y, lit = canMove.has(key);
      const el = document.createElement('div');
      el.className = 'tile' + ((x + y) % 2 ? ' b' : '') + (lit ? ' move' : '');
      el.style.cssText = 'left:' + x * (TILE + GAP) + 'px;top:' + y * (TILE + GAP) +
                         'px;width:' + TILE + 'px;height:' + TILE + 'px';
      if (lit) { el.innerHTML = '<span class="dot"></span>'; el.onclick = () => move(x, y); }
      else el.onclick = () => { game.selected = null; render(); };
      board.appendChild(el);
    }

    for (const u of game.units) {
      const anchor = document.createElement('div');
      anchor.className = 'unit-anchor';
      anchor.style.cssText = 'left:' + u.x * (TILE + GAP) + 'px;top:' + u.y * (TILE + GAP) +
                             'px;width:' + TILE + 'px;height:' + TILE + 'px';
      const mine = u.owner === mySide;
      const isTarget = canHit.has(u.id);
      const card = document.createElement('div');
      card.className = 'unit ' + (mine ? 'mine' : 'foe') +
        (u.id === game.selected ? ' selected' : '') +
        (isTarget ? ' target' : '') +
        (u.moved && u.acted ? ' spent' : '');
      card.style.setProperty('--tilt', -TILT + 'deg');
      card.style.setProperty('--accent', u.accent);
      card.style.setProperty('--wash', u.accent + '55');
      card.title = u.name + ' — ' + u.hp + '/' + u.maxHp + ' HP · ATK ' + u.atk +
                   ' · MOV ' + u.mov + ' · RNG ' + u.rng;
      card.innerHTML =
        '<div class="unit-art"><span class="unit-initial">' + u.name[0] + '</span></div>' +
        '<div class="unit-name">' + u.name + '</div>' +
        '<div class="unit-hpbar"><span style="width:' +
          Math.max(0, (u.hp / u.maxHp) * 100) + '%"></span></div>' +
        '<div class="unit-hp">' + u.hp + '</div>' +
        (isTarget ? '<div class="unit-crosshair"></div>' : '');
      card.onclick = (e) => {
        e.stopPropagation();
        if (isTarget) attack(u.id);
        else { game.selected = game.selected === u.id ? null : u.id; render(); }
      };
      const sh = document.createElement('div');
      sh.className = 'unit-shadow';
      anchor.append(card, sh);
      board.appendChild(anchor);
    }

    $('npHost').className = 'nameplate host' + (game.turn === 'host' && !game.winner ? ' active' : '');
    $('npGuest').className = 'nameplate guest' + (game.turn === 'guest' && !game.winner ? ' active' : '');

    const logEl = $('log');
    logEl.innerHTML = game.log.map((e) =>
      '<div class="logline"><span class="log-turn">T' + e.t + '</span><span>' + e.text + '</span></div>').join('');
    logEl.scrollTop = logEl.scrollHeight;

    const chatEl = $('chat');
    chatEl.innerHTML = game.chat.map((m) =>
      '<div class="msg' + (m.own ? ' msg-own' : '') + (m.spec ? ' msg-spec' : '') +
      '"><span class="msg-who">' + m.who + '</span><span>' + m.text + '</span></div>').join('');
    chatEl.scrollTop = chatEl.scrollHeight;

    const bar = $('actionbar');
    if (game.winner) {
      bar.innerHTML = '<div class="verdict">' +
        (game.winner === 'host' ? 'jared wins — that is you.' : 'opponent wins.') +
        '</div><button class="btn ghost" id="again">Play again</button>';
      $('again').onclick = () => location.reload();
    } else {
      const yours = game.turn === mySide;
      bar.innerHTML =
        '<button class="btn primary" id="endturn"' + (yours ? '' : ' disabled') + '>End turn</button>' +
        '<button class="btn ghost" disabled>Resign</button>' +
        '<span class="hint">' + (yours
          ? 'Click a unit, then a lit tile to move or a marked enemy to strike.'
          : 'Waiting for your opponent.') + '</span>';
      if (yours) $('endturn').onclick = () => endTurn(null);
    }
  }

  // ---- clock --------------------------------------------------------------
  setInterval(() => {
    const left = (game.deadline - Date.now()) / 1000;
    const pct = game.winner ? 0 : Math.max(0, Math.min(1, left / TURN_SECONDS));
    $('timerfill').style.width = pct * 100 + '%';
    $('timerbar').classList.toggle('urgent', !game.winner && left <= 8);
    $('timertext').textContent = game.winner
      ? 'Match over'
      : (game.turn === mySide ? 'Your turn' : 'Opponent thinking') +
        ' · ' + Math.max(0, Math.ceil(left)) + 's';
    if (!game.winner && left <= 0) {
      endTurn((game.turn === 'host' ? 'jared' : 'opponent') + ' ran out of time.');
    }
  }, 200);

  // The opponent takes its turn shortly after receiving it.
  let lastTurn = 'host';
  setInterval(() => {
    if (game.turn !== lastTurn) {
      lastTurn = game.turn;
      if (game.turn === 'guest') setTimeout(opponentPlays, 900);
    }
  }, 200);

  $('chatform').onsubmit = (e) => {
    e.preventDefault();
    const v = $('chatinput').value.trim();
    if (!v) return;
    game.chat.push({ who: 'jared', text: v, own: true });
    $('chatinput').value = '';
    render();
  };

  document.querySelector('.center').addEventListener('click', (e) => {
    if (e.target.classList.contains('center')) { game.selected = null; render(); }
  });

  render();
})();
</script>
