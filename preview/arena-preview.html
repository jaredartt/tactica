<title>Crown Nemesis Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Lexend:wght@400&display=swap">

<style>
/* Crown Nemesis — arena preview.
   Committed single-theme on purpose: an arena should look identical to both
   players, so every colour is painted explicitly rather than inherited. */
:root {
  color-scheme: light;
  --paper:   #ffffff;
  --paper-2: #f7f7fb;
  --tile-a:  #f3f3f9;
  --tile-b:  #eeeef6;
  --ink:     #0e0e14;
  --muted:   #75758a;
  --line:    #ebebf3;
  --line-2:  #dededf;
  --you:     #2f4bff;
  --foe:     #ff2e93;
  --good:    #00c46a;
  --danger:  #ff3b30;
  --display: "Unbounded", ui-sans-serif, system-ui, sans-serif;
  --body:    "Lexend", ui-sans-serif, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 14px/1.6 var(--body); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- preview banner ---- */
.note {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted);
}
.note b {
  font-family: var(--display); font-weight: 900; font-size: 10px;
  letter-spacing: 0.12em; color: var(--you);
}

/* ---- top bar ---- */
.matchbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--display); font-weight: 900; font-size: 14px; letter-spacing: -0.01em; }
.scoreline { display: flex; align-items: center; gap: 14px; }
.vs { color: #c4c4d2; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
.nameplate {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font-size: 13px;
  transition: color 0.25s, border-color 0.25s, background 0.25s;
}
.nameplate em {
  font-style: normal; font-size: 9px; opacity: 0.75; margin-left: 8px;
  text-transform: uppercase; letter-spacing: 0.12em;
}
.nameplate.host.active { color: #fff; background: var(--you); border-color: var(--you); }
.nameplate.guest.active { color: #fff; background: var(--foe); border-color: var(--foe); }
.roomcode {
  font-family: var(--display); font-weight: 900; font-size: 12px; letter-spacing: 0.1em;
  background: var(--paper-2); border: 1px solid var(--line);
  padding: 7px 14px; border-radius: 10px;
}

/* ---- turn clock: one hairline ---- */
.timerwrap { position: relative; height: 3px; }
.timerbar { position: relative; height: 3px; background: var(--line); overflow: hidden; }
.timerfill { height: 100%; width: 100%; background: var(--you); transition: width 0.2s linear; }
.timerbar.urgent .timerfill { background: var(--danger); }
.timertext {
  position: absolute; left: 0; right: 0; top: 10px; text-align: center;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}
.timerbar.urgent + .timertext { color: var(--danger); }

/* ---- three-column stage ---- */
.stage { flex: 1; display: grid; grid-template-columns: 250px 1fr 270px; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; }
.side-left { border-right: 1px solid var(--line); }
.side-right { border-left: 1px solid var(--line); }
.side-title {
  margin: 0; padding: 16px 18px 12px;
  font-family: var(--display); font-weight: 900;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink);
}
.side-body { flex: 1; overflow-y: auto; padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.side-foot { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.side-foot input {
  flex: 1; min-width: 0; padding: 9px 12px; background: var(--paper);
  border: 1px solid var(--line-2); border-radius: 10px; color: var(--ink);
  font: inherit; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.side-foot input::placeholder { color: #b3b3c4; }
.side-foot input:focus { border-color: var(--you); box-shadow: 0 0 0 3px rgba(47,75,255,.12); }
.msg { font-size: 13px; line-height: 1.5; }
.msg-who { color: var(--muted); margin-right: 8px; }
.msg-own .msg-who { color: var(--you); }
.msg-spec .msg-who::after { content: " · watching"; font-size: 10px; letter-spacing: .04em; color: #b3b3c4; }
.logline { display: flex; gap: 10px; font-size: 13px; color: #43435a; line-height: 1.5; }
.log-turn { color: #b3b3c4; font-size: 11px; flex: none; padding-top: 2px; font-variant-numeric: tabular-nums; }

.center {
  position: relative; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; padding: 44px 20px 24px;
}

/* ---- the arena ---- */
.arena { perspective: 1500px; perspective-origin: 50% 34%; display: grid; place-items: start center; }
.arena-scene { position: relative; display: grid; place-items: start center; }
.board { position: relative; transform-style: preserve-3d; transform-origin: 50% 0%; }
.tile {
  position: absolute; border-radius: 6px; background: var(--tile-a);
  transition: background 0.18s, box-shadow 0.18s;
}
.tile.b { background: var(--tile-b); }
.tile.move {
  background: rgba(47,75,255,.12); cursor: pointer;
  box-shadow: inset 0 0 0 1.5px rgba(47,75,255,.55);
}
.tile.move:hover { background: rgba(47,75,255,.24); }
.tile .dot {
  position: absolute; inset: 50% auto auto 50%; width: 8px; height: 8px;
  margin: -4px 0 0 -4px; border-radius: 50%; background: var(--you);
}

.unit-anchor { position: absolute; transform-style: preserve-3d; pointer-events: none; }
.unit-shadow {
  position: absolute; left: 50%; bottom: 8px; width: 58px; height: 18px; margin-left: -29px;
  background: radial-gradient(closest-side, rgba(14,14,20,.22), transparent); filter: blur(3px);
  transition: transform 0.22s cubic-bezier(.2,.8,.3,1), opacity 0.22s;
}
.unit {
  position: absolute; left: 50%; bottom: 6px; margin-left: -36px;
  width: 72px; height: 90px; pointer-events: auto; cursor: pointer;
  transform-origin: 50% 100%;
  transform: rotateX(var(--tilt)) translateY(0) scale(1);
  transition: transform 0.22s cubic-bezier(.2,.8,.3,1), box-shadow 0.22s, filter 0.22s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 6px 7px; border-radius: 12px;
  background: var(--paper); border: 1.5px solid var(--line-2);
  box-shadow: 0 4px 14px rgba(14,14,20,.10);
  animation: breathe 3.8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: rotateX(var(--tilt)) translateY(0) scale(1); }
  50%      { transform: rotateX(var(--tilt)) translateY(-4px) scale(1.005); }
}
.unit.mine { border-color: var(--you); }
.unit.foe  { border-color: var(--foe); }
.unit-anchor:hover .unit {
  animation: none;
  transform: rotateX(var(--tilt)) translateY(-18px) scale(1.08);
  box-shadow: 0 22px 34px rgba(14,14,20,.18); z-index: 5;
}
.unit-anchor:hover .unit-shadow { transform: scale(.76); opacity: .45; }
.unit.selected {
  animation: none;
  transform: rotateX(var(--tilt)) translateY(-14px) scale(1.06);
  box-shadow: 0 18px 30px rgba(14,14,20,.18), 0 0 0 3px rgba(47,75,255,.22);
}
.unit.target { animation: none; cursor: crosshair; border-color: var(--danger); }
.unit.target:hover { box-shadow: 0 22px 34px rgba(14,14,20,.18), 0 0 0 3px rgba(255,59,48,.25); }
.unit.spent { filter: grayscale(1) opacity(.55); animation: none; }

.unit-art {
  width: 100%; flex: 1; min-height: 0; border-radius: 7px; overflow: hidden;
  display: grid; place-items: center; background: var(--wash);
}
.unit-initial { font-family: var(--display); font-weight: 900; font-size: 21px; color: var(--accent); line-height: 1; }
.unit-name {
  font-size: 8px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.unit-hpbar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.unit-hpbar span { display: block; height: 100%; background: var(--good); transition: width .35s ease; }
.unit-hp {
  position: absolute; top: -8px; right: -8px; min-width: 21px; height: 21px; padding: 0 5px;
  border-radius: 999px; background: var(--ink); color: #fff;
  font-size: 10px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.unit-crosshair {
  position: absolute; inset: -7px; border: 1.5px dashed var(--danger); border-radius: 16px;
  animation: pulse 1.1s ease-in-out infinite; pointer-events: none;
}
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

/* ---- action bar ---- */
.actionbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn {
  padding: 11px 18px; background: var(--paper); border: 1px solid var(--line-2);
  border-radius: 10px; font: 400 14px/1 var(--body);
  transition: background .15s, border-color .15s, transform .08s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.primary {
  background: var(--you); border-color: var(--you); color: #fff;
  box-shadow: 0 2px 14px rgba(47,75,255,.28);
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--you); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; }
.verdict { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: -.01em; }

@media (max-width: 1080px) {
  .stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
  .center { order: -1; }
  .side { max-height: 200px; }
  .side-left, .side-right { border: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) {
  .unit, .unit-crosshair { animation: none !important; }
  .unit, .unit-shadow, .tile, .timerfill { transition: none !important; }
}
</style>

<div class="app">
  <div class="note">
    <b>PREVIEW</b>
    <span>Both sides on one screen, no network. In the real build this is two browsers talking through Supabase.</span>
    <span style="color:#0e0e14">Hover a card. Click a blue-edged unit, then a lit tile to move or a marked enemy to strike.</span>
  </div>

  <header class="matchbar">
    <span class="brand">CROWN NEMESIS</span>
    <div class="scoreline">
      <span class="nameplate host active" id="npHost">jared<em>you</em></span>
      <span class="vs">vs</span>
      <span class="nameplate guest" id="npGuest">opponent</span>
    </div>
    <span class="roomcode">K7QN3</span>
  </header>

  <div class="timerwrap">
    <div class="timerbar" id="timerbar"><div class="timerfill" id="timerfill"></div></div>
    <span class="timertext" id="timertext"></span>
  </div>

  <div class="stage">
    <aside class="side side-left">
      <h2 class="side-title">Chat</h2>
      <div class="side-body" id="chat"></div>
      <form class="side-foot" id="chatform">
        <input id="chatinput" placeholder="Say something…" maxlength="200" aria-label="Chat message">
        <button class="btn" type="submit" style="padding:9px 14px">Send</button>
      </form>
    </aside>

    <main class="center">
      <div class="arena">
        <div class="arena-scene" id="scene">
          <div class="board" id="board"></div>
        </div>
      </div>
      <div class="actionbar" id="actionbar"></div>
    </main>

    <aside class="side side-right">
      <h2 class="side-title">Battle log</h2>
      <div class="side-body" id="log"></div>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  const W = 7, H = 5, TILE = 76, GAP = 8, TILT = 52, TURN_SECONDS = 30;

  // The same placeholder roster the migration seeds, with the saturated
  // accents that read properly against white.
  const ROSTER = {
    vanguard: { name: 'Vanguard', hp: 14, atk: 4, mov: 3, rng: 1, accent: '#7c3aed' },
    archer:   { name: 'Archer',    hp: 8, atk: 4, mov: 2, rng: 3, accent: '#f59e0b' },
  };

  const mk = (id, owner, card, x, y) => ({
    id, owner, x, y, moved: false, acted: false,
    ...ROSTER[card], maxHp: ROSTER[card].hp,
  });

  const game = {
    turn: 'host', turnNumber: 1, selected: null, winner: null,
    deadline: Date.now() + TURN_SECONDS * 1000,
    units: [
      mk('h1', 'host',  'vanguard', 0, 1),
      mk('h2', 'host',  'archer',   0, 3),
      mk('g1', 'guest', 'vanguard', 6, 1),
      mk('g2', 'guest', 'archer',   6, 3),
    ],
    log: [{ t: 1, text: 'opponent entered the arena.' },
          { t: 1, text: 'Turn 1 — jared to act.' }],
    chat: [
      { who: 'opponent', text: 'ok show me what you built' },
      { who: 'jared', text: 'archer first, watch the range', own: true },
      { who: 'mara', text: 'go left, the vanguard is exposed', spec: true },
    ],
  };

  const $ = (id) => document.getElementById(id);
  const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const at = (x, y) => game.units.find((u) => u.x === x && u.y === y);
  const sel = () => game.units.find((u) => u.id === game.selected) || null;
  const mySide = 'host';

  function say(text) { game.log.push({ t: game.turnNumber, text }); }

  function reachable() {
    const u = sel(); const out = new Set();
    if (!u || u.owner !== game.turn || u.owner !== mySide || u.moved || game.winner) return out;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = dist(u, { x, y });
      if (d > 0 && d <= u.mov && !at(x, y)) out.add(x + ',' + y);
    }
    return out;
  }

  function targets() {
    const u = sel(); const out = new Set();
    if (!u || u.owner !== game.turn || u.owner !== mySide || u.acted || game.winner) return out;
    for (const o of game.units) if (o.owner !== u.owner && dist(u, o) <= u.rng) out.add(o.id);
    return out;
  }

  function move(x, y) {
    const u = sel(); if (!u) return;
    u.x = x; u.y = y; u.moved = true;
    say(u.name + ' advances.');
    render();
  }

  function attack(targetId) {
    const u = sel(); const t = game.units.find((z) => z.id === targetId);
    if (!u || !t) return;
    t.hp -= u.atk; u.acted = true; u.moved = true;
    const dead = t.hp <= 0;
    if (dead) game.units = game.units.filter((z) => z.id !== t.id);
    say(u.name + ' hits ' + t.name + ' for ' + u.atk + (dead ? ' — destroyed.' : '.'));
    if (!game.units.some((z) => z.owner !== u.owner)) {
      game.winner = u.owner;
      say((u.owner === 'host' ? 'jared' : 'opponent') + ' wins.');
      game.deadline = Infinity;
    }
    game.selected = null;
    render();
  }

  function endTurn(note) {
    if (game.winner) return;
    game.turn = game.turn === 'host' ? 'guest' : 'host';
    game.turnNumber += 1;
    game.units.forEach((u) => { u.moved = false; u.acted = false; });
    game.selected = null;
    if (note) say(note);
    say('Turn ' + game.turnNumber + ' — ' + (game.turn === 'host' ? 'jared' : 'opponent') + ' to act.');
    game.deadline = Date.now() + TURN_SECONDS * 1000;
    render();
  }

  function opponentPlays() {
    if (game.turn !== 'guest' || game.winner) return;
    const mine = game.units.filter((u) => u.owner === 'guest');
    const foes = game.units.filter((u) => u.owner === 'host');
    for (const u of mine) {
      if (!foes.length) break;
      let best = foes[0];
      for (const f of foes) if (dist(u, f) < dist(u, best)) best = f;
      if (dist(u, best) > u.rng) {
        const step = { x: u.x, y: u.y };
        let left = u.mov;
        while (left-- > 0) {
          const nx = { x: step.x + Math.sign(best.x - step.x), y: step.y };
          const ny = { x: step.x, y: step.y + Math.sign(best.y - step.y) };
          const pick = (Math.abs(best.x - step.x) >= Math.abs(best.y - step.y)) ? nx : ny;
          if (pick.x === step.x && pick.y === step.y) break;
          if (at(pick.x, pick.y)) break;
          step.x = pick.x; step.y = pick.y;
        }
        if (step.x !== u.x || step.y !== u.y) { u.x = step.x; u.y = step.y; say(u.name + ' advances.'); }
      }
      if (dist(u, best) <= u.rng && game.units.includes(best)) {
        best.hp -= u.atk;
        const dead = best.hp <= 0;
        if (dead) game.units = game.units.filter((z) => z.id !== best.id);
        say(u.name + ' hits ' + best.name + ' for ' + u.atk + (dead ? ' — destroyed.' : '.'));
        if (!game.units.some((z) => z.owner === 'host')) {
          game.winner = 'guest'; say('opponent wins.'); game.deadline = Infinity; render(); return;
        }
      }
    }
    setTimeout(() => endTurn(null), 700);
    render();
  }

  const board = $('board');
  const boardW = W * TILE + (W - 1) * GAP;
  const boardH = H * TILE + (H - 1) * GAP;
  board.style.width = boardW + 'px';
  board.style.height = boardH + 'px';
  board.style.transform = 'rotateX(' + TILT + 'deg)';
  $('scene').style.width = boardW + 'px';
  $('scene').style.height = (boardH * Math.cos(TILT * Math.PI / 180) + 170) + 'px';

  function render() {
    const canMove = reachable(), canHit = targets();
    board.querySelectorAll('.tile, .unit-anchor').forEach((n) => n.remove());

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const key = x + ',' + y, lit = canMove.has(key);
      const el = document.createElement('div');
      el.className = 'tile' + ((x + y) % 2 ? ' b' : '') + (lit ? ' move' : '');
      el.style.cssText = 'left:' + x * (TILE + GAP) + 'px;top:' + y * (TILE + GAP) +
                         'px;width:' + TILE + 'px;height:' + TILE + 'px';
      if (lit) { el.innerHTML = '<span class="dot"></span>'; el.onclick = () => move(x, y); }
      else el.onclick = () => { game.selected = null; render(); };
      board.appendChild(el);
    }

    for (const u of game.units) {
      const anchor = document.createElement('div');
      anchor.className = 'unit-anchor';
      anchor.style.cssText = 'left:' + u.x * (TILE + GAP) + 'px;top:' + u.y * (TILE + GAP) +
                             'px;width:' + TILE + 'px;height:' + TILE + 'px';
      const mine = u.owner === mySide;
      const isTarget = canHit.has(u.id);
      const card = document.createElement('div');
      card.className = 'unit ' + (mine ? 'mine' : 'foe') +
        (u.id === game.selected ? ' selected' : '') +
        (isTarget ? ' target' : '') +
        (u.moved && u.acted ? ' spent' : '');
      card.style.setProperty('--tilt', -TILT + 'deg');
      card.style.setProperty('--accent', u.accent);
      card.style.setProperty('--wash', u.accent + '29');
      card.title = u.name + ' — ' + u.hp + '/' + u.maxHp + ' HP · ATK ' + u.atk +
                   ' · MOV ' + u.mov + ' · RNG ' + u.rng;
      card.innerHTML =
        '<div class="unit-art"><span class="unit-initial">' + u.name[0] + '</span></div>' +
        '<div class="unit-name">' + u.name + '</div>' +
        '<div class="unit-hpbar"><span style="width:' +
          Math.max(0, (u.hp / u.maxHp) * 100) + '%"></span></div>' +
        '<div class="unit-hp">' + u.hp + '</div>' +
        (isTarget ? '<div class="unit-crosshair"></div>' : '');
      card.onclick = (e) => {
        e.stopPropagation();
        if (isTarget) attack(u.id);
        else { game.selected = game.selected === u.id ? null : u.id; render(); }
      };
      const sh = document.createElement('div');
      sh.className = 'unit-shadow';
      anchor.append(card, sh);
      board.appendChild(anchor);
    }

    $('npHost').className = 'nameplate host' + (game.turn === 'host' && !game.winner ? ' active' : '');
    $('npGuest').className = 'nameplate guest' + (game.turn === 'guest' && !game.winner ? ' active' : '');

    const logEl = $('log');
    logEl.innerHTML = game.log.map((e) =>
      '<div class="logline"><span class="log-turn">T' + e.t + '</span><span>' + e.text + '</span></div>').join('');
    logEl.scrollTop = logEl.scrollHeight;

    const chatEl = $('chat');
    chatEl.innerHTML = game.chat.map((m) =>
      '<div class="msg' + (m.own ? ' msg-own' : '') + (m.spec ? ' msg-spec' : '') +
      '"><span class="msg-who">' + m.who + '</span><span>' + m.text + '</span></div>').join('');
    chatEl.scrollTop = chatEl.scrollHeight;

    const bar = $('actionbar');
    if (game.winner) {
      bar.innerHTML = '<div class="verdict">' +
        (game.winner === 'host' ? 'jared wins — that is you.' : 'opponent wins.') +
        '</div><button class="btn ghost" id="again">Play again</button>';
      $('again').onclick = () => location.reload();
    } else {
      const yours = game.turn === mySide;
      bar.innerHTML =
        '<button class="btn primary" id="endturn"' + (yours ? '' : ' disabled') + '>End turn</button>' +
        '<button class="btn ghost" disabled>Resign</button>' +
        '<span class="hint">' + (yours
          ? 'Click a unit, then a lit tile to move or a marked enemy to strike.'
          : 'Waiting for your opponent.') + '</span>';
      if (yours) $('endturn').onclick = () => endTurn(null);
    }
  }

  setInterval(() => {
    const left = (game.deadline - Date.now()) / 1000;
    const pct = game.winner ? 0 : Math.max(0, Math.min(1, left / TURN_SECONDS));
    $('timerfill').style.width = pct * 100 + '%';
    $('timerbar').classList.toggle('urgent', !game.winner && left <= 8);
    $('timertext').textContent = game.winner
      ? 'Match over'
      : (game.turn === mySide ? 'Your turn' : 'Opponent thinking') +
        ' · ' + Math.max(0, Math.ceil(left)) + 's';
    if (!game.winner && left <= 0) {
      endTurn((game.turn === 'host' ? 'jared' : 'opponent') + ' ran out of time.');
    }
  }, 200);

  let lastTurn = 'host';
  setInterval(() => {
    if (game.turn !== lastTurn) {
      lastTurn = game.turn;
      if (game.turn === 'guest') setTimeout(opponentPlays, 900);
    }
  }, 200);

  $('chatform').onsubmit = (e) => {
    e.preventDefault();
    const v = $('chatinput').value.trim();
    if (!v) return;
    game.chat.push({ who: 'jared', text: v, own: true });
    $('chatinput').value = '';
    render();
  };

  document.querySelector('.center').addEventListener('click', (e) => {
    if (e.target.classList.contains('center')) { game.selected = null; render(); }
  });

  render();
})();
</script>
